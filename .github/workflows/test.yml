name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-latest
    container: python:3.11-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: apt-get update && apt-get install -y desktop-file-utils && pip install uv && uv sync --frozen --python /usr/local/bin/python
      - name: Unit and protocol tests
        run: .venv/bin/pytest -q && .venv/bin/python tests/protocol_smoke.py
  x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Isolated desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-gi gir1.2-gtk-3.0 python3-pil x11-utils xdotool xclip xsel tesseract-ocr tesseract-ocr-eng tesseract-ocr-ukr tesseract-ocr-rus
      - name: Isolated refused and stalled clipboard owners
        run: VIBER_XSEL=/usr/bin/xsel python3 tests/clipboard_x11.py
      - name: Real X11 fixture, no Viber account
        run: python3 tests/synthetic_x11.py
